<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Directory Structure</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }
        h1 {
            color: #2c3e50;
            border-bottom: 2px solid #3498db;
            padding-bottom: 10px;
        }
        .controls {
            margin-bottom: 20px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 8px 16px;
            margin-right: 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #2980b9;
        }
        ul.tree {
            list-style-type: none;
            padding-left: 0;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        ul.tree ul {
            list-style-type: none;
            padding-left: 25px;
            border-left: 1px dashed #bdc3c7;
            margin-left: 10px;
        }
        li {
            margin: 5px 0;
            line-height: 1.6;
        }
        .toggle {
            cursor: pointer;
            display: inline-block;
            width: 15px;
            text-align: center;
            color: #7f8c8d;
            font-size: 12px;
            user-select: none;
        }
        .icon {
            margin-right: 5px;
        }
        .name {
            font-family: 'Consolas', 'Courier New', monospace;
        }
        .folder > .name {
            font-weight: 600;
            color: #2c3e50;
        }
        .file > .name {
            color: #555;
        }
        .root > .name {
            font-size: 1.2em;
            color: #2980b9;
        }
    </style>
</head>
<body>
</body>
</html>
